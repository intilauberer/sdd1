[project]
name = "gcsgrep"
version = "0.1.0"
description = "grep sobre el contenido de objetos de Google Cloud Storage, sin bajarlos primero"
requires-python = ">=3.9"
dependencies = [
    "google-cloud-storage>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gcsgrep = "gcsgrep.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gcsgrep*"]
