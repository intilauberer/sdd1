# floci-gcp en lugar de fake-gcs-server, en el mismo servicio `gcs` (red interna, sin
# puertos, detrás del gateway). Lo suma config.sh con GCSGREP_TP4_EMULATOR=floci; el job
# `emulator` de CI lo corre en su fila `floci` (spec D-9). Solo cambia la imagen y el puerto
# del upstream (EMU_PORT=4588). 0.9.0 es la versión que corrió el TP1 (ADR-0014); el digest
# es el índice multiplataforma que resolvió CI.
services:
  gcs:
    image: floci/floci-gcp:0.9.0@sha256:ea29a53b34d04ba05240cdc6833608e43ae2b0a67849e5b97f01a7224e1138ea
    command: !reset null   # la imagen trae su propio arranque; los flags de fake-gcs-server no aplican
