name: tp4 (gcs-mcp-tp4)

# Chequeos offline del TP4 (spec.md: VC-0, VC-3, VC-8a, VC-11a, VC-13). CI no tiene
# credencial de GCP: nada de esto habla con GCS ni levanta el server MCP. Lo que pide el
# bucket real (VC-1, VC-2, VC-5…VC-10, VC-11b) se corre a mano y queda en evidencia/.
on:
  push:
    branches: ["**"]
    paths:
      - "gcs-mcp-tp4/**"
      - ".mcp.json"
      - ".claude/**"
      - "gcsgrep-tp1/scripts/check-doc-links.py"
      - ".github/workflows/tp4.yml"
  pull_request:
    paths:
      - "gcs-mcp-tp4/**"
      - ".mcp.json"
      - ".claude/**"
      - "gcsgrep-tp1/scripts/check-doc-links.py"
      - ".github/workflows/tp4.yml"

permissions:
  contents: read

jobs:
  offline:
    name: Config, hook, plugin y nota (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-alcance compara contra la base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JSON válido
        run: |
          for f in .mcp.json .claude/settings.json gcs-mcp-tp4/server/*.json \
                   gcs-mcp-tp4/plugin/gcsgrep-toolkit/.claude-plugin/plugin.json \
                   gcs-mcp-tp4/plugin/gcsgrep-toolkit/.mcp.json \
                   gcs-mcp-tp4/plugin/gcsgrep-toolkit/hooks/hooks.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
      - name: Los scripts compilan / parsean
        run: |
          python3 -m py_compile gcs-mcp-tp4/scripts/*.py .claude/hooks/*.py
          for f in gcs-mcp-tp4/bucket/*.sh gcs-mcp-tp4/plugin/armar.sh; do bash -n "$f"; done
      - name: Enlaces relativos (VC-13)
        run: python3 gcsgrep-tp1/scripts/check-doc-links.py gcs-mcp-tp4
      - name: Hook gcs-allowlist, 66 casos (VC-8a)
        run: python3 gcs-mcp-tp4/scripts/test_gcs_allowlist.py
      - name: Config de MCP fijada y sin secretos (VC-3)
        run: python3 gcs-mcp-tp4/scripts/check-config.py
      - name: El plugin commiteado es lo que arma armar.sh (VC-11a)
        run: bash gcs-mcp-tp4/plugin/armar.sh --check
      - name: Sin nombres viejos de tools en skills y agents del plugin (VC-11a)
        run: |
          if grep -rn 'mcp__gcs__' gcs-mcp-tp4/plugin/gcsgrep-toolkit/skills gcs-mcp-tp4/plugin/gcsgrep-toolkit/agents; then
            echo "plugin skills/agents still reference the repo tool names"; exit 1
          fi
      - name: Nota de seguridad (VC-13)
        run: python3 gcs-mcp-tp4/scripts/check-nota.py
      - name: Alcance (VC-0)
        # En main no hay contra qué comparar: el diff ya entró.
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          python3 gcs-mcp-tp4/scripts/check-alcance.py "$base"
