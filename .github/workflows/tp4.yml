name: tp4 (gcs-mcp-tp4)

# TP4 (spec.md). Job `offline`: VC-0, VC-2a…VC-2c, VC-3, VC-6c, VC-8a, VC-11a, VC-13, VC-14 y
# VC-15, sin Docker ni GCS (los tests del gateway y de check-generations usan un GCS de
# mentira en el mismo proceso). Job `emulator` (D-9): levanta el emulador detrás del gateway
# de solo lectura y corre VC-1, VC-10a (con VC-2d), VC-10b, VC-6a y VC-1b de punta a punta.
# CI no tiene credencial de GCP: nada de esto habla con el GCS real. Lo que pide una sesión
# de Claude (VC-4, VC-5a…VC-5d, VC-6b, VC-7, VC-8b, VC-9, VC-11b) se corre a mano y queda
# en evidencia/.
on:
  push:
    branches: ["**"]
    paths:
      - "gcs-mcp-tp4/**"
      - ".mcp.json"
      - ".claude/**"
      - "gcsgrep-tp1/scripts/check-doc-links.py"
      - ".github/workflows/tp4.yml"
      - ".claude-plugin/**"
  pull_request:
    paths:
      - "gcs-mcp-tp4/**"
      - ".mcp.json"
      - ".claude/**"
      - "gcsgrep-tp1/scripts/check-doc-links.py"
      - ".github/workflows/tp4.yml"
      - ".claude-plugin/**"

permissions:
  contents: read

jobs:
  offline:
    name: Config, hook, plugin y nota (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-alcance compara contra la base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JSON válido
        run: |
          for f in .mcp.json .claude/settings.json gcs-mcp-tp4/server/*.json \
                   gcs-mcp-tp4/plugin/gcsgrep-toolkit/.claude-plugin/plugin.json \
                   gcs-mcp-tp4/plugin/gcsgrep-toolkit/.mcp.json \
                   gcs-mcp-tp4/plugin/gcsgrep-toolkit/hooks/hooks.json \
                   gcs-mcp-tp4/gcs-real/mcp.json.ejemplo .claude-plugin/marketplace.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
      - name: Los scripts compilan / parsean
        run: |
          python3 -m py_compile gcs-mcp-tp4/scripts/*.py gcs-mcp-tp4/emulador/gateway.py .claude/hooks/*.py
          for f in gcs-mcp-tp4/gcs-real/bucket/*.sh gcs-mcp-tp4/emulador/*.sh gcs-mcp-tp4/plugin/armar.sh; do bash -n "$f"; done
      - name: Enlaces relativos (VC-13)
        run: python3 gcsgrep-tp1/scripts/check-doc-links.py gcs-mcp-tp4
      - name: Hook gcs-allowlist, 74 casos (VC-8a)
        run: python3 gcs-mcp-tp4/scripts/test_gcs_allowlist.py
      - name: Latencia del hook, p95 <= 100 ms (VC-15)
        run: python3 gcs-mcp-tp4/scripts/medir-hook.py
      - name: Gateway caso por caso, sin Docker (VC-2a, VC-2b, VC-2c)
        run: python3 gcs-mcp-tp4/scripts/test_gateway.py
      - uses: astral-sh/setup-uv@v6
      - name: check-generations contra un GCS de mentira (VC-14, VC-6c)
        run: uv run --no-project --with google-cloud-storage==3.14.1 python gcs-mcp-tp4/scripts/test_check_generations.py
      - name: Config de MCP fijada y sin secretos (VC-3)
        run: python3 gcs-mcp-tp4/scripts/check-config.py
      - name: El plugin commiteado es lo que arma armar.sh (VC-11a)
        run: bash gcs-mcp-tp4/plugin/armar.sh --check
      - name: Sin nombres viejos de tools en skills y agents del plugin (VC-11a)
        run: |
          if grep -rn 'mcp__gcs__' gcs-mcp-tp4/plugin/gcsgrep-toolkit/skills gcs-mcp-tp4/plugin/gcsgrep-toolkit/agents; then
            echo "plugin skills/agents still reference the repo tool names"; exit 1
          fi
      - name: Nota de seguridad (VC-13)
        run: python3 gcs-mcp-tp4/scripts/check-nota.py
      - name: Alcance (VC-0)
        # En main no hay contra qué comparar: el diff ya entró.
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          python3 gcs-mcp-tp4/scripts/check-alcance.py "$base"

  emulator:
    # Spike tp4/eval-floci: el mismo job contra floci-gcp. En la fila floci cada paso sigue
    # aunque falle el anterior, para ver todo lo que no anda; el resumen lo lista.
    strategy:
      fail-fast: false
      matrix:
        emulator: [fake-gcs-server, floci]
    name: Emulador + gateway, capa 3 de punta a punta (D-9) · ${{ matrix.emulator }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCSGREP_TP4_GATEWAY: http://127.0.0.1:4443
      GCSGREP_TP4_EMULATOR: ${{ matrix.emulator }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v6
      - name: Levantar emulador y gateway
        id: levantar-emulador-y-gateway
        continue-on-error: ${{ matrix.emulator == 'floci' }}
        run: gcs-mcp-tp4/emulador/levantar.sh
      - name: Armar el bucket (VC-1)
        id: armar-el-bucket-vc-1
        continue-on-error: ${{ matrix.emulator == 'floci' }}
        run: gcs-mcp-tp4/emulador/armar-bucket.sh
      - name: Escribir y borrar por el gateway dan 403; no hay camino directo (VC-10a)
        id: escribir-y-borrar-por-el-gateway-dan-403
        continue-on-error: ${{ matrix.emulator == 'floci' }}
        run: gcs-mcp-tp4/emulador/probar-403.sh
      - name: El server MCP sin hook contra el gateway (VC-10b)
        id: el-server-mcp-sin-hook-contra-el-gateway
        continue-on-error: ${{ matrix.emulator == 'floci' }}
        env:
          STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
        run: python3 gcs-mcp-tp4/scripts/probar-server-sin-hook.py
      - name: Las lecturas del skill por MCP (spike floci)
        id: lecturas-mcp
        continue-on-error: ${{ matrix.emulator == 'floci' }}
        env:
          STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
        run: python3 gcs-mcp-tp4/scripts/probar-lecturas-mcp.py
      - name: Procedencia y evidencia que envejece de punta a punta (R-14a, R-6a, R-6b, VC-6a)
        id: procedencia-y-evidencia-que-envejece-de-
        continue-on-error: ${{ matrix.emulator == 'floci' }}
        env:
          STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
        run: |
          set -euo pipefail
          source gcs-mcp-tp4/emulador/config.sh
          CG=(uv run --no-project --with google-cloud-storage==3.14.1 python gcs-mcp-tp4/scripts/check-generations.py)
          out="$RUNNER_TEMP/vcs-bucket.md"
          args=()
          for o in logs/app-2026-10-01.log logs/app-2026-10-02.log; do
            args+=("gs://$BUCKET/$o@$(object_field "$o" updated)")
          done
          "${CG[@]}" registrar "${args[@]}" | tee "$out"
          "${CG[@]}" verificar "$out"
          gcs-mcp-tp4/emulador/cambiar-objeto.sh
          rc=0; "${CG[@]}" verificar "$out" | tee "$RUNNER_TEMP/verificar.txt" || rc=$?
          [ "$rc" -eq 1 ] && grep -q "^STALE gs://$BUCKET/logs/app-2026-10-02.log recorded=" "$RUNNER_TEMP/verificar.txt" \
            || { echo "expected exit 1 with a STALE line (got $rc)"; exit 1; }
      - name: Objetos de más (VC-1b)
        id: objetos-de-m-s-vc-1b
        continue-on-error: ${{ matrix.emulator == 'floci' }}
        # Al final: deja un objeto extra y re-arma el bucket (generations nuevas).
        run: |
          set -uo pipefail
          source gcs-mcp-tp4/emulador/config.sh
          d="$(mktemp -d)"
          printf 'sobra\n' > "$d/sobra.log"
          printf '%s\n' 'set -eu' \
            'curl -sS -f -o /dev/null -X POST -H "Content-Type: text/plain" --data-binary @/work/sobra.log "http://gcs:$EMU_PORT/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=extra%2Fsobra.log"' \
            > "$d/up.sh"
          admin_run "$d" /work/up.sh
          rc=0
          gcs-mcp-tp4/emulador/armar-bucket.sh > "$RUNNER_TEMP/armar2.out" 2> "$RUNNER_TEMP/armar2.err" || rc=$?
          cat "$RUNNER_TEMP/armar2.err"
          if [ "$rc" -eq 1 ] && grep -q "WARNING: unexpected objects: extra/sobra.log" "$RUNNER_TEMP/armar2.err" \
             && ! grep -q "Manifest" "$RUNNER_TEMP/armar2.out"; then
            echo "VC-1b: PASS (exit 1, WARNING, no manifest)"
          else
            echo "VC-1b: FAIL (exit $rc)"; cat "$RUNNER_TEMP/armar2.out"; exit 1
          fi
      - name: Logs del gateway
        if: always()
        run: |
          source gcs-mcp-tp4/emulador/config.sh
          compose logs --no-log-prefix gateway || true
      - name: Imagen del emulador y resumen
        if: always()
        run: |
          source gcs-mcp-tp4/emulador/config.sh
          echo "gcs image: $(docker inspect --format '{{index .RepoDigests 0}}' "$(compose ps -q gcs)" 2>/dev/null || docker image inspect --format '{{index .RepoDigests 0}}' floci/floci-gcp:0.9.0 2>/dev/null || echo '?')"
          {
            echo "### Emulador: $GCSGREP_TP4_EMULATOR"
            echo
            echo "| paso | resultado |"
            echo "|---|---|"
            echo "| Levantar emulador y gateway | ${{ steps.levantar-emulador-y-gateway.outcome }} |"
            echo "| Armar el bucket (VC-1) | ${{ steps.armar-el-bucket-vc-1.outcome }} |"
            echo "| Escribir y borrar por el gateway dan 403; no hay camino directo (VC-10a) | ${{ steps.escribir-y-borrar-por-el-gateway-dan-403.outcome }} |"
            echo "| El server MCP sin hook contra el gateway (VC-10b) | ${{ steps.el-server-mcp-sin-hook-contra-el-gateway.outcome }} |"
            echo "| Las lecturas del skill por MCP | ${{ steps.lecturas-mcp.outcome }} |"
            echo "| Procedencia y evidencia que envejece de punta a punta (R-14a, R-6a, R-6b, VC-6a) | ${{ steps.procedencia-y-evidencia-que-envejece-de-.outcome }} |"
            echo "| Objetos de más (VC-1b) | ${{ steps.objetos-de-m-s-vc-1b.outcome }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Logs del emulador
        if: always()
        run: |
          source gcs-mcp-tp4/emulador/config.sh
          compose logs --no-log-prefix --tail 200 gcs || true
      - name: Bajar
        if: always()
        run: gcs-mcp-tp4/emulador/bajar.sh
